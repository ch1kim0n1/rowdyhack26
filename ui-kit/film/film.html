<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Appraisal Job · Film Source</title>
<!-- The scroll film is rendered from this page, one frame at a time, by render.mjs.
     Open it in a browser with ?t=6.2 to look at any moment of the picture. -->
<link rel="stylesheet" href="../noir.css">
<link rel="stylesheet" href="src/film.css">
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="noir-grade">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.02 0.10 0.50 0.88 0.97"/>
        <feFuncG type="table" tableValues="0.02 0.10 0.50 0.88 0.97"/>
        <feFuncB type="table" tableValues="0.02 0.10 0.50 0.88 0.97"/>
      </feComponentTransfer>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <filter id="stamp-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>
</svg>
<div id="frame" class="film-frame"></div>
<script src="../noir.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
