line-length = 110
target-version = "py310"
# ui-kit is a vendored design pack; its tools and minified JS are not ours to lint.
exclude = ["ui-kit"]

[lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[lint.per-file-ignores]
# Env scrubbing and sys.path setup must precede the rig imports.
"tests/**" = ["E402"]
